<title>Paper Sniper</title>
%%PWA%%
<link rel="icon" type="image/png" href="data:image/png;base64,__FAV__">
<link rel="apple-touch-icon" href="data:image/png;base64,__TOUCH__">
<meta name="theme-color" content="#151726">
<style>
%%FONTS%%
/* =========================================================
   DIRECTION : l'interface est celle d'un service secret des années 60
   (dossiers dactylographiés, tampons, étiquettes Dymo), sobre et sérieuse,
   en décalage volontaire avec la ville en papier très colorée.
   ========================================================= */
:root{
  --night:#151726;    /* fond nuit, lunette */
  --ink:#1f1e29;      /* encre noire */
  --carbon:#2b3570;   /* bleu de papier carbone : texte tapé, validations */
  --paper:#ebe6d6;    /* papier administratif */
  --paper2:#dfd8c3;   /* zones encadrées */
  --manila:#d3b574;   /* chemise cartonnée */
  --stamp:#b3261e;    /* tampon rouge */
  --graphite:#5c5a66; /* texte secondaire */
  --rule:#b8b09a;     /* filets */
  --f-sten:'Stardos Stencil','Courier Prime',Georgia,serif;
  --f-type:'Courier Prime','Courier New',ui-monospace,monospace;
  --f-ui:'IBM Plex Sans Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--night);overflow:hidden;overscroll-behavior:none}
body{font:500 15px/1.4 var(--f-ui);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
#app{position:fixed;top:0;bottom:0;left:50%;width:min(100%,500px);transform:translateX(-50%);overflow:hidden;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.lay{position:absolute;inset:0;pointer-events:none}
.lay>*{pointer-events:auto}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:2px solid var(--manila);outline-offset:3px}

/* ---------- Boutons : ruban Dymo embossé ---------- */
.pb{--tape:var(--ink);border:0;border-radius:3px;padding:11px 16px 10px;min-height:42px;background-color:var(--tape);color:#f3efe3;
  font:600 14px/1.1 var(--f-ui);letter-spacing:.14em;text-transform:uppercase;
  background-image:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0) 42%,rgba(0,0,0,.16)),repeating-linear-gradient(90deg,rgba(255,255,255,.04) 0 1px,transparent 1px 3px);
  text-shadow:0 1px 0 rgba(0,0,0,.5),0 -1px 0 rgba(255,255,255,.22);
  box-shadow:0 2px 0 rgba(0,0,0,.45),0 6px 14px rgba(0,0,0,.25);transition:transform .07s,box-shadow .07s}
.pb:active{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.25)}
.pb.red{--tape:var(--stamp)}
.pb.blue{--tape:var(--carbon)}
.pb.paper{--tape:var(--manila);color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.35);font-weight:700}
.pb.big{font-size:16px;padding:15px 22px 14px;min-height:52px;letter-spacing:.16em}
.pb.wide{width:100%}
.pb.sm{font-size:12px;padding:8px 11px 7px;min-height:34px;letter-spacing:.1em}
.pb.ghost{background:transparent;background-image:none;color:var(--ink);box-shadow:inset 0 0 0 1.5px currentColor;text-shadow:none}
.pb.ghost.light{color:var(--paper)}
.pb[disabled]{opacity:.38;pointer-events:none}
.lnk{border:0;background:none;padding:6px 2px;font:400 14px var(--f-type);color:var(--graphite);text-decoration:underline;text-underline-offset:3px}

/* ---------- Documents (feuilles modales) ---------- */
.veil{position:absolute;inset:0;background:rgba(9,10,19,.72);display:flex;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 14px calc(env(safe-area-inset-bottom,0px) + 16px);box-sizing:border-box;z-index:40}
.sheet{position:relative;width:100%;max-height:100%;overflow:auto;background:var(--paper);border-radius:2px;padding:16px 18px 20px;box-sizing:border-box;
  background-image:radial-gradient(rgba(60,50,30,.05) 1px,transparent 1.4px),linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 30%);background-size:5px 5px,100% 100%;
  box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 3px 6px rgba(0,0,0,.35),0 22px 48px rgba(0,0,0,.55)}
.dh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font:400 12.5px var(--f-type);color:var(--graphite);padding-bottom:7px;border-bottom:1px solid var(--ink);box-shadow:0 2px 0 var(--paper),0 3px 0 var(--ink);margin:0 0 12px}
.dh .cf{color:var(--stamp);font-weight:700}
.sheet h2{font:700 30px/1 var(--f-sten);margin:2px 0 10px;letter-spacing:.01em;text-wrap:balance;color:var(--ink)}
.sheet h3{font:600 13px var(--f-ui);letter-spacing:.06em;color:var(--graphite);margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--rule)}
.tag{display:block;font:400 13px var(--f-type);color:var(--carbon)}
.sheet p,.type{margin:8px 0;font:400 15px/1.5 var(--f-type);color:var(--carbon)}
.sheet p b,.type b{font-weight:700;color:var(--ink)}
.small{font-size:13.5px!important}
.stamp{position:absolute;right:14px;top:50px;font:700 19px/1 var(--f-sten);letter-spacing:.06em;color:var(--stamp);border:3px solid currentColor;border-radius:4px;padding:6px 10px 5px;transform:rotate(-8deg);opacity:.86;mix-blend-mode:multiply;pointer-events:none;
  -webkit-mask-image:radial-gradient(circle at 30% 40%,#000 55%,rgba(0,0,0,.75) 70%,#000 85%);mask-image:radial-gradient(circle at 30% 40%,#000 55%,rgba(0,0,0,.75) 70%,#000 85%)}
.stamp.ok{color:var(--carbon)}
.stamped .tag{padding-right:96px}.stamped h2{padding-right:124px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btns{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:18px}
.btns.col{flex-direction:column;align-items:stretch}
.close{position:absolute;right:12px;top:10px}
.money{font:700 18px var(--f-type);color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.risk{display:inline-flex;gap:3px;vertical-align:middle}
.risk i{width:12px;height:8px;background:transparent;box-shadow:inset 0 0 0 1.5px var(--stamp)}
.risk i.on{background:var(--stamp)}
.proc{margin:10px 0 0;padding:0;list-style:none;counter-reset:p}
.proc li{counter-increment:p;display:grid;grid-template-columns:28px 1fr;gap:6px;padding:9px 0;border-top:1px dashed var(--rule);font:400 14.5px/1.45 var(--f-type);color:var(--carbon)}
.proc li:before{content:counter(p);font:700 22px/1 var(--f-sten);color:var(--stamp)}
.proc li b{color:var(--ink)}

/* champs de formulaire (briefing, fiche, synthèse) */
.clue{display:grid;grid-template-columns:92px 1fr;gap:10px;align-items:baseline;padding:8px 0;border-top:1px dashed var(--rule);font:400 14.5px/1.4 var(--f-type);color:var(--ink)}
.clue:first-of-type{border-top:0}
.clue b.k{font:600 12px/1.3 var(--f-ui);letter-spacing:.04em;color:var(--graphite)}
.clue .no{color:var(--graphite);font-style:italic}
.fiche{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;background:var(--paper2);padding:10px;margin:10px 0;box-shadow:inset 0 0 0 1px var(--rule)}
.fiche canvas{width:66px;height:84px;flex:none;background:#f6f3ea;box-shadow:0 0 0 3px #f6f3ea,0 0 0 4px var(--rule),2px 3px 0 4px rgba(0,0,0,.12)}
.fiche .clue{grid-template-columns:74px 1fr;font-size:13.5px}

/* évaluation (rapport) */
.eval{display:grid;gap:2px;margin:6px 0 12px}
.eval div{display:flex;gap:10px;align-items:center;font:400 14.5px var(--f-type);color:var(--graphite);padding:4px 0}
.eval i{width:16px;height:16px;flex:none;box-shadow:inset 0 0 0 1.5px var(--ink);position:relative}
.eval .ok{color:var(--ink)}
.eval .ok i:after{content:'';position:absolute;left:5px;top:0;width:5px;height:11px;border:solid var(--carbon);border-width:0 3px 3px 0;transform:rotate(40deg)}
.total{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--ink);padding-top:10px;font:600 13px var(--f-ui);letter-spacing:.06em;color:var(--graphite)}
.total .money{font-size:26px}
.notice{background:var(--paper2);box-shadow:inset 3px 0 0 var(--stamp);padding:9px 12px;margin:10px 0 0;font:400 14px/1.45 var(--f-type);color:var(--ink)}

/* ---------- Splash + titre ---------- */
#splash{position:absolute;inset:0;background:#000;display:grid;place-items:center;z-index:90;transition:opacity .6s}
#splash img{width:min(56%,230px);opacity:0;animation:fin 1s ease .15s forwards}
@keyframes fin{to{opacity:1}}
#title{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:calc(env(safe-area-inset-top,0px) + 6vh) 24px calc(env(safe-area-inset-bottom,0px) + 4vh);box-sizing:border-box;z-index:30;pointer-events:none;
  background:linear-gradient(180deg,rgba(13,14,25,0) 0%,rgba(13,14,25,0) 80%,rgba(13,14,25,.85) 100%),url(data:image/webp;base64,__KEY__) center 30%/cover,#151726}
#title>*{pointer-events:auto}
.logo h1{margin:0;font:700 clamp(56px,18vw,84px)/.86 var(--f-sten);color:var(--ink);letter-spacing:.015em;text-shadow:0 2px 0 rgba(255,255,255,.35)}
.logo p{margin:16px 0 0;display:inline-block;background:var(--paper);color:var(--carbon);font:400 14px var(--f-type);padding:5px 10px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.logo .cls{display:inline-block;margin-bottom:12px;font:700 13px var(--f-sten);letter-spacing:.12em;color:#e2574d;border:2px solid currentColor;padding:4px 8px 3px;transform:rotate(-3deg)}
.tgo{margin-top:22px}
.tstats{display:inline-block;font:400 13px/1.45 var(--f-type);color:var(--carbon);background:rgba(235,230,214,.82);padding:3px 8px;margin-top:12px}
.tfoot{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.tfoot .studio{margin:0 0 4px}
.trow{display:flex;gap:8px}
#title .pb.ghost.light{background:rgba(21,23,38,.55)}
.studio{font:600 11px var(--f-ui);letter-spacing:.24em;color:var(--paper);opacity:.55;text-transform:uppercase;margin-top:18px}

/* ---------- Le Bureau (planque) ---------- */
#hq{position:absolute;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 22px);box-sizing:border-box;
  background:linear-gradient(180deg,rgba(13,14,25,.88),rgba(13,14,25,.62) 45%,rgba(13,14,25,.9))}
.hqtop{display:flex;align-items:flex-end;gap:10px;justify-content:space-between}
.hqtop h2{margin:0;font:700 36px/.9 var(--f-sten);color:var(--paper)}
.purse{background:var(--paper);padding:6px 10px 5px;text-align:right;box-shadow:0 2px 0 rgba(0,0,0,.45)}
.purse small{display:block;font:600 10.5px var(--f-ui);letter-spacing:.1em;color:var(--graphite)}
.hqsub{color:var(--paper);font:400 13.5px/1.5 var(--f-type);margin:12px 0 0;opacity:.92}
.board{margin-top:22px;display:grid;gap:26px}
.ccard{position:relative;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;text-align:left;border:0;background:var(--manila);border-radius:0 3px 3px 3px;padding:14px 14px 13px;
  background-image:linear-gradient(180deg,rgba(255,255,255,.14),rgba(0,0,0,.05));box-shadow:0 2px 0 rgba(0,0,0,.35),0 10px 22px rgba(0,0,0,.35);color:var(--ink)}
.ccard:before{content:attr(data-n);position:absolute;left:0;top:-19px;height:19px;padding:0 12px;background:var(--manila);border-radius:4px 4px 0 0;font:700 12px/20px var(--f-type);color:#5b4a22}
.ccard:active{transform:translateY(2px)}
.ccard .sil{width:56px;height:70px;background:#26283a;display:grid;place-items:center;font:700 34px var(--f-sten);color:#6b6e86;box-shadow:0 0 0 3px #f2efe6,1px 2px 0 3px rgba(0,0,0,.25)}
.ccard .al{display:block;font:700 19px/1.1 var(--f-type)}
.ccard .mp{display:block;font:500 13px var(--f-ui);color:#4d4228;margin-top:3px}
.ccard .ln{display:flex;justify-content:space-between;align-items:baseline;margin-top:9px;padding-top:7px;border-top:1px dashed rgba(60,45,15,.35)}
.ccard .pr{font:700 18px var(--f-type)}
.ccard .dt{display:block;font:400 12.5px var(--f-type);color:#4d4228;margin-top:4px}
.locked{margin-top:20px;font:400 12.5px var(--f-type);color:var(--paper);opacity:.75}
.hqbtns{display:flex;gap:10px;justify-content:flex-start;align-items:center;margin-top:22px;flex-wrap:wrap}
.upg{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:center;padding:11px 0;border-top:1px dashed var(--rule)}
.upg b{font:600 15px var(--f-ui);color:var(--ink)}
.upg small{grid-column:1;font:400 13px/1.4 var(--f-type);color:var(--carbon)}
.upg .pips{display:flex;gap:4px;grid-column:1;margin-top:3px}
.upg .pips i{width:14px;height:6px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.upg .pips i.on{background:var(--ink)}
.upg .pb{grid-row:1 / span 3;grid-column:2}

/* ---------- Synthèse et indicateurs ---------- */
.offer{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:center;padding:10px 0;border-top:1px dashed var(--rule)}
.offer b{font:600 14.5px var(--f-ui);color:var(--ink)}
.offer small{font:400 13px/1.4 var(--f-type);color:var(--carbon)}
.offer .pb{grid-row:1 / span 2;grid-column:2}
.offer .ok{grid-row:1 / span 2;grid-column:2;font:700 12px var(--f-sten);letter-spacing:.08em;color:var(--carbon);border:2px solid currentColor;padding:3px 6px 2px;transform:rotate(-4deg)}
.offer.miss b{color:var(--stamp)}

/* ---------- Bureau de l'enquête (portrait-robot) ---------- */
#desk{position:absolute;inset:0;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px calc(env(safe-area-inset-bottom,0px) + 18px);box-sizing:border-box;
  background:radial-gradient(90% 55% at 50% 22%,#3a3529,#1d1c22 70%,#121219)}
.note{background:var(--paper);padding:9px 12px;font:400 14px/1.45 var(--f-type);color:var(--carbon);box-shadow:0 2px 0 rgba(0,0,0,.4);margin:2px 0 14px}
.note b{color:var(--ink)}
.pola{background:#f4f2ea;padding:9px 9px 32px;box-shadow:0 3px 0 rgba(0,0,0,.35),0 16px 30px rgba(0,0,0,.45);position:relative;margin:0 auto;max-width:440px}
.pola canvas{display:block;width:100%;height:auto;touch-action:manipulation}
.pola .cap{position:absolute;left:11px;right:11px;bottom:8px;font:400 14px var(--f-type);color:var(--carbon);display:flex;justify-content:space-between}
.tbar{height:4px;background:rgba(255,255,255,.12);margin:12px auto 0;max-width:440px;overflow:hidden}
.tbar i{display:block;height:100%;width:100%;background:var(--stamp)}
#form{margin-top:14px;background:var(--paper);padding:14px 14px 16px;box-shadow:0 3px 6px rgba(0,0,0,.35),0 18px 36px rgba(0,0,0,.45)}
#form .dh{margin-bottom:6px}
.fld{padding:9px 0 10px;border-top:1px dashed var(--rule)}.fld:first-of-type{border-top:0}
.fld b{display:block;font:600 12px var(--f-ui);letter-spacing:.06em;color:var(--graphite);margin-bottom:7px}
.chs{display:flex;flex-wrap:wrap;gap:6px}
.chp{border:0;border-radius:2px;padding:7px 10px;background:transparent;font:600 13.5px var(--f-ui);color:var(--ink);display:inline-flex;align-items:center;gap:7px;box-shadow:inset 0 0 0 1.5px var(--ink)}
.chp i{width:13px;height:13px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(0,0,0,.55)}
.chp.on{background:var(--ink);color:var(--paper)}
.chp.ok{background:var(--carbon);color:#fff;box-shadow:none}
.chp.ko{background:var(--stamp);color:#fff;box-shadow:none;text-decoration:line-through}
.dhint{text-align:center;font:400 13px var(--f-type);color:var(--paper);margin:12px 0 0}

/* ---------- HUD (lunette, mini-jeux) ---------- */
.top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;align-items:center;gap:8px;z-index:10}
.clk{background:var(--ink);color:#f3efe3;font:700 19px/1 var(--f-type);padding:7px 9px 6px;border-radius:3px;font-variant-numeric:tabular-nums;box-shadow:0 2px 0 rgba(0,0,0,.5);letter-spacing:.02em;
  background-image:linear-gradient(180deg,rgba(255,255,255,.1),rgba(0,0,0,.15))}
#tgtmini{width:40px;height:52px;background:#f6f3ea;flex:none;cursor:pointer;box-shadow:0 0 0 2px #f6f3ea,0 2px 0 2px rgba(0,0,0,.45)}
#chips{display:flex;gap:5px;flex:1;min-width:0;flex-wrap:wrap}
#chips span{background:var(--paper);padding:3px 7px 2px;font:700 12px var(--f-type);color:var(--ink);white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.4)}
#chips span.no{color:var(--graphite);font-weight:400}
#zoom{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:10}
#zoom button{width:46px;height:40px;border:0;border-radius:3px;background:rgba(21,23,38,.82);color:var(--paper);font:600 15px var(--f-ui);box-shadow:inset 0 0 0 1.5px rgba(235,230,214,.45)}
#zoom button.on{background:var(--stamp);box-shadow:0 2px 0 rgba(0,0,0,.45)}
.bot{position:absolute;left:0;right:0;bottom:0;padding:8px 14px calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;align-items:flex-end;justify-content:space-between;gap:10px;z-index:10}
.round{width:84px;height:84px;border-radius:50%;border:0;display:grid;place-items:center;font:600 12.5px var(--f-ui);letter-spacing:.12em;text-transform:uppercase;position:relative;
  box-shadow:0 3px 0 rgba(0,0,0,.55),inset 0 0 0 3px rgba(0,0,0,.22),inset 0 2px 0 rgba(255,255,255,.25)}
#breath{background:var(--paper);color:var(--ink)}
#breath.hold{background:#cfd5ea}
#breath svg{position:absolute;inset:-5px;width:94px;height:94px;transform:rotate(-90deg);pointer-events:none}
#fire{width:98px;height:98px;background:var(--stamp);color:#fff;font:700 15px var(--f-ui);letter-spacing:.2em;text-shadow:0 1px 0 rgba(0,0,0,.4)}
#fire.cool{background:#6e3b37;color:rgba(255,255,255,.6)}
#fire.eye{background:var(--ink);color:var(--paper);font-size:13px;letter-spacing:.14em}
#breath.off,#pinb[disabled]{opacity:.35;pointer-events:none}
#pinb{width:64px;height:64px;background:var(--paper);color:var(--ink);font-size:10.5px;letter-spacing:.08em}
.hint2{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 122px);text-align:center;font:400 13px/1.4 var(--f-type);color:var(--paper);text-shadow:0 1px 4px #000;pointer-events:none;z-index:9;padding:0 70px;transition:opacity .6s}
#hint2>span{display:inline-block;background:rgba(13,14,25,.72);padding:4px 9px;text-shadow:none}
#toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top,0px) + 72px);transform:translate(-50%,-8px);background:var(--paper);color:var(--ink);font:700 13.5px/1.35 var(--f-type);padding:8px 13px;box-shadow:0 2px 0 rgba(0,0,0,.45),0 8px 18px rgba(0,0,0,.35);opacity:0;transition:opacity .25s,transform .25s;z-index:60;max-width:86%;text-align:center;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.bad{background:var(--stamp);color:#fff}
.testp{margin-top:22px;border:1px dashed rgba(235,230,214,.35);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.testp b{width:100%;text-align:center;font:600 11px var(--f-ui);letter-spacing:.14em;color:var(--manila)}
.films{display:flex;gap:6px}.films i{width:16px;height:22px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 1.5px var(--paper);position:relative}
.films i:after{content:'';position:absolute;left:4px;right:4px;top:5px;bottom:5px;background:var(--manila)}
.films i.off{opacity:.25}
.mgt{font:700 20px var(--f-sten);color:var(--paper);margin-left:auto;text-shadow:0 2px 0 rgba(0,0,0,.4)}
#upd{position:absolute;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:95;display:flex;align-items:center;gap:10px;background:var(--paper);padding:9px 10px 9px 14px;font:700 13px var(--f-type);color:var(--ink);box-shadow:0 3px 0 rgba(0,0,0,.4),0 12px 30px rgba(0,0,0,.5)}
#upd span{flex:1}#upd .x{border:0;background:none;font:700 22px var(--f-ui);color:var(--graphite);padding:0 4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div id="app">
  <canvas id="cv" aria-label="Scène du jeu"></canvas>
